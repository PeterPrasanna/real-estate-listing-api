services:
  app:
    build: .
    working_dir: /app
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://app:app@database:5432/real_estate?serverVersion=16&charset=utf8"

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: real_estate
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d real_estate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: