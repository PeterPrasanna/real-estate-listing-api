name: Backend CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: real_estate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d real_estate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_SECRET: test_secret
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/real_estate_test?serverVersion=16&charset=utf8
      JWT_SECRET_KEY: '%kernel.project_dir%/config/jwt/private.pem'
      JWT_PUBLIC_KEY: '%kernel.project_dir%/config/jwt/public.pem'
      JWT_PASSPHRASE: test_passphrase
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_pgsql, openssl, mbstring, xml
          coverage: none
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: php bin/console lexik:jwt:generate-keypair --overwrite --no-interaction
      - run: php bin/console doctrine:migrations:migrate --no-interaction
      - run: php bin/phpunit
